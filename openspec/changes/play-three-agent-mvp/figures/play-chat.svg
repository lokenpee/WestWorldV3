<svg xmlns="http://www.w3.org/2000/svg" width="920" height="710" viewBox="0 0 920 710" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">存档 1 的连续聊天记录，示例显示留在官厅追问云光的一轮</title>
  <desc id="desc">顶栏是返回存档与当前身份。开场、玩家行动、故事回复依次纵向排列，左侧有头像。末条故事回复已结算，表示正文和相应剧情变化已保存。玩家打开它的菜单，可以改写本轮。底部保留自由输入框和发送按钮。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #f0eeeb }
    .bar { font-size: 18px; font-weight: 600 } .meta { font-size: 14px; fill: #bcb8c2 }
    .name { font-size: 17px; font-weight: 650 } .story { font-family: "Songti SC", SimSun, "Microsoft YaHei", serif; font-size: 21px }
    .action { font-size: 19px } .mark { font-family: "Songti SC", SimSun, serif; fill: #e2d1b9; font-size: 25px }
    .menu { fill: #e6d0b2; font-size: 15px } .hint { fill: #c1bdc6; font-size: 17px }
    .btn { fill: #262321; font-size: 16px; font-weight: 650 }
  </style>
  <rect width="920" height="710" rx="14" fill="#19191d"/>
  <rect x="33" y="20" width="118" height="40" rx="7" stroke="#535058" fill="#27262c"/>
  <path d="M59 33 l-7 7 7 7" fill="none" stroke="#dfdbe3" stroke-width="1.7"/>
  <text x="72" y="46" class="meta">返回存档</text>
  <text x="174" y="36" class="bar">红楼之挽天倾 · 赖家线</text>
  <text x="174" y="61" class="meta">存档 1　·　扮演贾珩</text>
  <path d="M0 81 H920" stroke="#444148"/>
  <rect x="48" y="114" width="46" height="52" rx="8" fill="#4a3d34" stroke="#76614d"/>
  <text x="71" y="149" class="mark" text-anchor="middle">叙</text>
  <text x="116" y="135" class="name">叙事</text>
  <text x="170" y="135" class="meta">开场</text>
  <text x="116" y="174" class="story">翠华山的匪情已经谈过，贾珩和云光仍在官厅里。</text>
  <text x="116" y="207" class="story">方才他改称贾珩为“恩主”。此刻，他等着贾珩开口。</text>
  <path d="M48 240 H872" stroke="#38363d"/>
  <rect x="48" y="267" width="46" height="52" rx="8" fill="#353c47" stroke="#576171"/>
  <text x="71" y="302" class="mark" text-anchor="middle">珩</text>
  <text x="116" y="288" class="name">贾珩</text>
  <text x="170" y="288" class="meta">你 · 第 1 轮</text>
  <text x="116" y="326" class="action">我留在这里，问云光方才为什么改口。</text>
  <path d="M48 361 H872" stroke="#38363d"/>
  <rect x="48" y="390" width="46" height="52" rx="8" fill="#4a3d34" stroke="#76614d"/>
  <text x="71" y="425" class="mark" text-anchor="middle">叙</text>
  <text x="116" y="411" class="name">叙事</text>
  <text x="170" y="411" class="meta">第 1 轮 · 已结算</text>
  <rect x="829" y="384" width="43" height="33" rx="6" fill="#343239" stroke="#615c65"/>
  <g fill="#e3dfe7"><circle cx="843" cy="401" r="1.7"/><circle cx="851" cy="401" r="1.7"/><circle cx="859" cy="401" r="1.7"/></g>
  <text x="116" y="455" class="story">贾珩却提起了先前的话：“你方才怎么改称我恩主？”</text>
  <text class="story"><tspan x="116" y="486">云光欠了欠身。“是下官方才失礼。”</tspan><tspan x="116" y="513">说到“失礼”二字，他住了口，抬眼望着贾珩。</tspan></text>
  <rect x="740" y="425" width="132" height="42" rx="7" fill="#353137" stroke="#68606a"/>
  <text x="806" y="452" text-anchor="middle" class="menu">改写本轮</text>
  <path d="M0 534 H920" stroke="#454149"/>
  <rect x="48" y="556" width="824" height="126" rx="11" fill="#28272d" stroke="#625c66"/>
  <text x="69" y="594" class="hint">以贾珩的身份行动或说话……</text>
  <rect x="757" y="623" width="97" height="40" rx="7" fill="#3b393f" stroke="#524e56"/>
  <text x="805.5" y="649" text-anchor="middle" class="meta">发送</text>
</svg>
