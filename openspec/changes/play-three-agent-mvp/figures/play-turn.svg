<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1750" viewBox="0 0 1280 1750" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">从玩家的一句话到存档的下一版</title><desc id="desc">从左上角的发送行动开始，沿箭头查看程序如何接收行动、导演如何判断能否尝试、玩家如何申诉，以及核准的动作、回应和停笔位置怎样写成小说并保存。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#54665f"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#20372f} .body{font-size:17px}.minor{font-size:15px;fill:#50635b}.head{font-size:21px;font-weight:700}.section{font-size:26px;font-weight:700}.title{font-size:35px;font-weight:700}.edge{fill:none;stroke:#54665f;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f8f7f3"/>
<text x="48" y="55" class="title">从玩家的一句话，到存档的下一版</text>
<text x="48" y="91" class="body">赖家线 · V0 是已保存的官厅开场。金色表示玩家操作，绿色表示模型任务，蓝色表示保存的数据。</text>
<path d="M48 111 H1232" stroke="#cdd4cc"/>
<g><rect x="48" y="139" width="325" height="142" rx="12" fill="#fdf3df" stroke="#ae8a4c" stroke-width="1.5"/>
<text x="66" y="172" class="head">玩家 · 发送行动</text>
<text x="66" y="203" class="body">“我留在这里，问云光</text>
<text x="66" y="229" class="body">方才为什么改口。”</text>
<text x="66" y="255" class="body">玩家可以提做法、对白或期望。</text>
</g>
<g><rect x="414" y="139" width="374" height="142" rx="12" fill="#fff" stroke="#a3b3a7" stroke-width="1.5"/>
<text x="432" y="172" class="head">程序 · 接收这条行动</text>
<text x="432" y="203" class="body">核对书、存档和玩家看到的版本。</text>
<text x="432" y="229" class="body">保存输入全文，给本次执行分配编号。</text>
<text x="432" y="255" class="body">接下来这个存档暂时不能发送新行动。</text>
</g>
<g><rect x="830" y="139" width="402" height="142" rx="12" fill="#e6eef7" stroke="#879fb8" stroke-width="1.5"/>
<text x="848" y="172" class="head">登记请求和正在处理它的存档</text>
<text x="848" y="203" class="body">playAttempts 存全文、所用版本和执行期限。</text>
<text x="848" y="229" class="body">playSaves 记本档正在处理哪条请求。</text>
<text x="848" y="255" class="body">重复发送时，返回进度或已提交的版本号。</text>
</g>
<path d="M373 208 H413" class="edge"/>
<path d="M788 208 H829" class="edge"/>
<g><rect x="414" y="332" width="374" height="153" rx="12" fill="#fff" stroke="#a3b3a7" stroke-width="1.5"/>
<text x="432" y="365" class="head">程序 · 给导演准备资料</text>
<text x="432" y="396" class="body">读取建档时保存的书中资料和本局经历。</text>
<text x="432" y="422" class="body">选出当前场景和在场人物各自知道的事，</text>
<text x="432" y="448" class="body">附上相关正文、资料目录和玩家输入。</text>
<text x="432" y="474" class="body">怎样选取旧事，见《开局生成与历史摘要》。</text>
</g>
<path d="M601 281 V331" class="edge"/>
<g><rect x="48" y="332" width="325" height="153" rx="12" fill="#fff" stroke="#a3b3a7" stroke-width="1.5"/>
<text x="66" y="365" class="head">玩家输入怎样参与裁定</text>
<text x="66" y="396" class="body">“让云光一定说实话”是预期。</text>
<text x="66" y="422" class="body">导演先判断能否发问，再决定</text>
<text x="66" y="448" class="body">云光是否回应、回应到什么程度。</text>
</g>
<path d="M210 485 V596 H413" class="edge"/>
<g><rect x="414" y="531" width="374" height="144" rx="12" fill="#e9f2ee" stroke="#78a48e" stroke-width="1.5"/>
<text x="432" y="564" class="head">行动导演 · play-direct</text>
<text x="432" y="595" class="body">判断普通行动、申诉或改写。</text>
<text x="432" y="621" class="body">能尝试时，给出场景起点、动作链、</text>
<text x="432" y="647" class="body">停笔位置、应更新的状态及依据。</text>
</g>
<path d="M601 485 V530" class="edge"/>
<g><rect x="830" y="411" width="402" height="234" rx="12" fill="#e6eef7" stroke="#879fb8" stroke-width="1.5"/>
<text x="848" y="444" class="head">行动导演可操作的工具</text>
<text x="848" y="475" class="body">browse_play_sources  搜本角色可读的资料，</text>
<text x="848" y="501" class="body">取得摘要、资料编号和下一页的位置。</text>
<text x="848" y="527" class="body">read_play_source  按资料编号读详情或续页。</text>
<text x="848" y="553" class="body">submit_result  交本次裁定。驳回时提交</text>
<text x="848" y="579" class="body">decision=reject、原因码和主角可知的依据。</text>
<text x="848" y="605" class="body">请求、工具输入与返回结果记入 playRuns。</text>
</g>
<path d="M788 556 H829" class="edge"/>
<path d="M830 613 H789" class="edge"/>
<g><rect x="48" y="721" width="325" height="184" rx="12" fill="#f8eae3" stroke="#be9681" stroke-width="1.5"/>
<text x="66" y="754" class="head">无法发起 · 该条行动已撤回</text>
<text x="66" y="785" class="body">例如已离厅，仍要原地低声当面问。</text>
<text x="66" y="811" class="body">保存这条请求，说明主角可知的原因。</text>
<text x="66" y="837" class="body">恢复发送；本局仍停在行动前。</text>
<text x="66" y="863" class="body">玩家可另发行动，也可补充一次理由。</text>
</g>
<path d="M414 644 H210 V720" class="edge"/>
<g><rect x="414" y="721" width="818" height="184" rx="12" fill="#fff" stroke="#a3b3a7" stroke-width="1.5"/>
<text x="432" y="754" class="head">可以尝试 · 程序核准动作链，准备写手能看到的材料</text>
<text x="432" y="785" class="body">行动可以成功、部分成功或尝试后失败。程序检查行动前的状态、现场证据，以及谁怎样得知。</text>
<text x="432" y="811" class="body">按顺序取出导演允许写进小说的动作、对白、即时后果和停笔位置，给每步分配写手可用的资料编号。</text>
<text x="432" y="837" class="body">附上在场人物的口吻、眼前可见的事、近期正文和写作偏好。</text>
<text x="432" y="863" class="body">云光改口的真实动机尚未查明。写手只能呈现贾珩听到的答话。</text>
</g>
<path d="M601 675 V720" class="edge"/>
<g><rect x="48" y="970" width="325" height="171" rx="12" fill="#fdf3df" stroke="#ae8a4c" stroke-width="1.5"/>
<text x="66" y="1003" class="head">玩家 · 申诉一次</text>
<text x="66" y="1034" class="body">保留首次输入、驳回理由和补充说明。</text>
<text x="66" y="1060" class="body">本档空闲、进度未变且尚未申诉时，</text>
<text x="66" y="1086" class="body">沿用请求编号，换执行编号重新裁定。</text>
<text x="66" y="1112" class="body">再次驳回后仍可另发新行动。</text>
</g>
<path d="M210 905 V969" class="edge"/>
<path d="M373 1054 H394 V662 H413" class="edge"/>
<g><rect x="414" y="970" width="374" height="171" rx="12" fill="#fffdf7" stroke="#cfc4ab" stroke-width="1.5"/>
<text x="432" y="1003" class="head">导演给写手的本轮动作链</text>
<text x="432" y="1034" class="body">起点　翠华山匪情已谈过，两人仍在厅里。</text>
<text x="432" y="1060" class="body">贾珩回问方才为何改称「恩主」</text>
<text x="432" y="1086" class="body">→ 云光欠身，只说方才失礼</text>
<text x="432" y="1112" class="body">→ 云光住口抬眼，等贾珩接话。</text>
</g>
<g><rect x="830" y="970" width="402" height="171" rx="12" fill="#e9f2ee" stroke="#78a48e" stroke-width="1.5"/>
<text x="848" y="1003" class="head">写手 · play-write / turn</text>
<text x="848" y="1034" class="body">依动作链写追问和回答。可补眼神、语气，</text>
<text x="848" y="1060" class="body">写到云光等候，下一步留给玩家。</text>
<text x="848" y="1086" class="body">用 submit_result 交按阅读顺序排好的段落，</text>
<text x="848" y="1112" class="body">每段标明写了哪一步、用了哪些资料。</text>
</g>
<path d="M601 905 V969" class="edge"/>
<path d="M788 1055 H829" class="edge"/>
<g><rect x="48" y="1216" width="325" height="159" rx="12" fill="#f8eae3" stroke="#be9681" stroke-width="1.5"/>
<text x="66" y="1249" class="head">取消、中断或最终失败</text>
<text x="66" y="1280" class="body">撤下本轮预览，恢复发送。</text>
<text x="66" y="1306" class="body">保留原版，重试时分配新的执行编号。</text>
<text x="66" y="1332" class="body">刷新、申诉后重试、迟来的结果及改写</text>
<text x="66" y="1358" class="body">见《回合恢复与末轮改写》。</text>
</g>
<g><rect x="414" y="1216" width="818" height="159" rx="12" fill="#e6eef7" stroke="#879fb8" stroke-width="1.5"/>
<text x="432" y="1249" class="head">待结算 · 写手已交稿，正在保存本轮</text>
<text x="432" y="1280" class="body">程序核对段落的顺序、动作链的覆盖情况及资料编号。检查通过后，聊天区可预览整条回复。</text>
<text x="432" y="1306" class="body">playAttempts 暂存裁定和文稿，playRuns 记录工具返回。程序整轮保存时，玩家暂时不能发送。</text>
<text x="432" y="1332" class="body">保存前核对存档、请求编号、执行编号，以及玩家所见的版本是否仍然生效。</text>
</g>
<path d="M1031 1141 V1215" class="edge"/>
<path d="M414 1287 H374" class="edge"/>
<g><rect x="414" y="1421" width="818" height="144" rx="12" fill="#e6eef7" stroke="#879fb8" stroke-width="1.5"/>
<text x="432" y="1454" class="head">整轮一起保存成功后，本局进度才更新</text>
<text x="432" y="1485" class="body">playVersions 保存正文、剧情步骤、实际变化及依据，记录这一版的场景、人物、地点、物品、</text>
<text x="432" y="1511" class="body">关系、人物所知、承诺和事件。场景还记录导演决定留给玩家接话的位置。</text>
<text x="432" y="1537" class="body">playSaves 记下当前生效版本并恢复发送，playAttempts 记下本次请求已提交的版本号。</text>
</g>
<path d="M816 1375 V1420" class="edge"/>
<g><rect x="414" y="1611" width="818" height="106" rx="12" fill="#fdf3df" stroke="#ae8a4c" stroke-width="1.5"/>
<text x="432" y="1644" class="head">玩家 · 读已结算的回复，决定下一句</text>
<text x="432" y="1675" class="body">V1 中云光听过追问，贾珩听过辩解；动机仍待查。玩家可继续输入，或从末轮菜单改写。</text>
</g>
<path d="M816 1565 V1610" class="edge"/>
</svg>
